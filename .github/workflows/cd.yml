name: CD - Publish Immutable Container

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set immutable image name
        id: image
        shell: bash
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and publish
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.image.outputs.image }}

      - name: Scan published image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.image.outputs.image }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  prepare-staging-manifest:
    runs-on: ubuntu-latest
    needs: publish
    environment: staging
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Prepare immutable Kubernetes manifest
        env:
          IMAGE: ${{ needs.publish.outputs.image }}
        run: |
          mkdir -p release
          cp k8s/deployment.yaml release/deployment.yaml
          cp k8s/service.yaml release/service.yaml
          cp k8s/network-policy.yaml release/network-policy.yaml
          sed -i "s|ghcr.io/REPLACE_ME/privacy-devsecops-demo:latest|${IMAGE}|" release/deployment.yaml
          grep -n "image:" release/deployment.yaml

      - name: Upload deployment bundle
        uses: actions/upload-artifact@v4
        with:
          name: staging-kubernetes-manifests
          path: release/
