name: CI - Test, Privacy, Security, Container, IaC

on:
  pull_request:
  push:
    branches: ["main"]

permissions:
  contents: read
  security-events: write

jobs:
  python-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Lint
        run: |
          ruff check app tests scripts
          ruff format --check app tests scripts

      - name: Type check
        run: mypy app

      - name: Unit tests and coverage gate
        run: pytest --cov=app --cov-report=term-missing --cov-fail-under=85

      - name: Bandit SAST
        run: bandit -q -r app

      - name: Dependency vulnerability audit
        run: pip-audit -r requirements.txt

      - name: Custom privacy policy check
        run: python scripts/privacy_check.py .

  repository-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Trivy repository vulnerability/secret scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          exit-code: "1"

      - name: Trivy Infrastructure-as-Code scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: k8s
          severity: HIGH,CRITICAL
          exit-code: "1"

  container:
    runs-on: ubuntu-latest
    needs: [python-quality]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build container image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false
          tags: privacy-devsecops-demo:${{ github.sha }}

      - name: Scan built image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: privacy-devsecops-demo:${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
