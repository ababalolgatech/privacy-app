name: Beginner Continuous Security Workflow

on:
  push:
  pull_request:

jobs:
  continuous-checks:
    runs-on: ubuntu-latest

    steps:
      - name: 0. Checkout code
        uses: actions/checkout@v4

      - name: 0. Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 0. Install application and check tools
        run: pip install -r requirements-dev.txt

      # ---------------------------------------------------------
      # 1. LINT
      # Checks formatting/style mistakes and common Python issues.
      # ---------------------------------------------------------
      - name: 1. Lint
        run: ruff check app tests scripts

      # ---------------------------------------------------------
      # 2. TYPE CHECK
      # Checks whether type hints are being used consistently.
      # ---------------------------------------------------------
      - name: 2. Type Check
        run: mypy app scripts

      # ---------------------------------------------------------
      # 3. UNIT TESTS
      # Runs the application's automated functional/privacy tests.
      # ---------------------------------------------------------
      - name: 3. Unit Tests
        run: pytest -q

      # ---------------------------------------------------------
      # 4. COVERAGE
      # Confirms that tests execute a useful portion of app code.
      # ---------------------------------------------------------
      - name: 4. Coverage
        run: pytest --cov=app --cov-report=term-missing --cov-fail-under=80

      # ---------------------------------------------------------
      # 5. SAST
      # Bandit checks Python source code for security problems.
      # ---------------------------------------------------------
      - name: 5. SAST
        run: bandit -r app -q

      # ---------------------------------------------------------
      # 6. DEPENDENCY SCAN
      # pip-audit checks Python packages for known vulnerabilities.
      # ---------------------------------------------------------
      - name: 6. Dependency Scan
        run: pip-audit -r requirements.txt

      # ---------------------------------------------------------
      # 7. SECRET SCAN
      # Trivy scans the repository for accidentally committed secrets.
      # ---------------------------------------------------------
      - name: 7. Secret Scan
        uses: aquasecurity/trivy-action@v0.28.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: secret
          exit-code: "1"
          severity: HIGH,CRITICAL

      # ---------------------------------------------------------
      # 8. PRIVACY POLICY CHECK
      # Our own tiny policy-as-code script.
      # ---------------------------------------------------------
      - name: 8. Privacy Policy Check
        run: python scripts/privacy_check.py

      # ---------------------------------------------------------
      # 9. IaC SCAN
      # Trivy checks the Kubernetes YAML for misconfigurations.
      # ---------------------------------------------------------
      - name: 9. IaC Scan
        uses: aquasecurity/trivy-action@v0.28.0
        with:
          scan-type: config
          scan-ref: k8s
          exit-code: "0"
          severity: HIGH,CRITICAL

      # ---------------------------------------------------------
      # Start the app so DAST can test a RUNNING service.
      # ---------------------------------------------------------
      - name: Start FastAPI for DAST
        run: |
          uvicorn app.main:app --host 0.0.0.0 --port 8000 &
          echo $! > uvicorn.pid
          sleep 5
          curl --fail http://127.0.0.1:8000/health

      # ---------------------------------------------------------
      # 10. DAST
      # OWASP ZAP scans the running API from the outside.
      # ---------------------------------------------------------
      - name: 10. DAST
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: "http://127.0.0.1:8000"
          fail_action: false
          allow_issue_writing: false

      # ---------------------------------------------------------
      # Final packaging step
      # ---------------------------------------------------------
      - name: 11. Build Docker Image
        run: docker build -t beginner-privacy-api:${{ github.sha }} .
