name: DAST - ZAP Baseline

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "app/**"
      - "requirements*.txt"
      - ".github/workflows/dast.yml"

permissions:
  contents: read

jobs:
  zap-baseline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt

      - name: Start API locally
        env:
          APP_ENV: test
          DEMO_API_KEY: ci-demo-api-key-not-production
          TOKENIZATION_KEY: ci-demo-token-key-not-production
        run: |
          uvicorn app.main:app --host 0.0.0.0 --port 8000 > /tmp/uvicorn.log 2>&1 &
          for i in {1..20}; do
            curl --fail --silent http://127.0.0.1:8000/health/ready && exit 0
            sleep 1
          done
          cat /tmp/uvicorn.log
          exit 1

      - name: OWASP ZAP baseline scan
        run: |
          docker run --rm --network host \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py -t http://127.0.0.1:8000 -I
